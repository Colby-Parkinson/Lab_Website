  description: "Tourism and Recreation Analytics for Communities and Ecosystems — University of Wyoming"
  site-url: https://thetracelab.org
  favicon: assets/favicon.svg
  navbar:
    logo: assets/logo.svg
    logo-alt: "TRACE Lab"
    title: false
    left:
      - text: "Home"
        href: index.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Work With Us"
        href: work-with-us.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "People"
        href: people.qmd
    right:
      - text: "<span class='nav-cta'>Join the lab</span>"
        href: people.qmd#join-the-lab
  page-footer:
    left: "TRACE Lab · Haub School of Environment and Natural Resources · University of Wyoming"
